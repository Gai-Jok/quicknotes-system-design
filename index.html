<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css" />
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>A live demo of QuickNotes talking to a real API.</p>
  </header>

  <main>
    <section>
      <h2>Load notes</h2>
      <button type="button" id="load-btn">Load notes</button>
      <p id="status"></p>
    </section>

    <section>
      <h2>Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" name="title" placeholder="Note title (max 100 characters)" />

        <label for="body-input">Body</label>
        <textarea id="body-input" name="body" rows="4" placeholder="Note body (optional)"></textarea>

        <button type="submit" id="submit-btn">Add Note</button>
      </form>
    </section>

    <section>
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
  </footer>
</body>
</html>
